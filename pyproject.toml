[project]
name = "analbot"
version = "0.1.0"
description = "Your bot, but not feral."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
analbot = "analbot.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
